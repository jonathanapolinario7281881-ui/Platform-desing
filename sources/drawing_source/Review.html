<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Review window — v4 proposal</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0E13;--panel:#121720;--panel2:#0F141C;--line:#232B38;--row:#1A212C;--text:#E7EAEE;--soft:#C9D1DB;--muted:#9BA6B5;--dim:#7D8899;--green:#34C77B;--red:#F0555A;--amber:#F2A93B;--yellow:#F2C94C;--blue:#5AA2FF;--purple:#B08CFF;--pink:#F9A8D4;--teal:#5CE0D2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg)}
.win{position:relative;width:1536px;height:864px;overflow:hidden;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;display:flex;flex-direction:column}
.mono{font-family:'IBM Plex Mono',monospace}
.nw{white-space:nowrap}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
header{height:48px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 10px 0 6px;background:var(--panel);border-bottom:1px solid var(--line)}
.back{height:34px;padding:0 11px 0 9px;border-radius:7px;border:1px solid #5B9BEA;background:#1D5AA8;color:#fff;display:flex;align-items:center;gap:7px;white-space:nowrap;font-family:inherit}
.back b{font-size:12.5px;letter-spacing:.03em}
kbd{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;padding:1px 4px;border-radius:3px;border:1px solid rgba(255,255,255,.55);color:#DCE8FA}
.wtitle{font-size:15px;font-weight:700;margin-left:4px;white-space:nowrap}
.env{height:28px;display:flex;align-items:center;padding:0 9px;border-radius:6px;border:1px solid #3E5470;background:#1B2433;color:#A9C7FF;font-size:11.5px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.autop{height:28px;display:flex;align-items:center;padding:0 10px;border-radius:6px;border:1px solid #3A4556;background:#1A212C;font-size:11.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.lab{font-size:10px;letter-spacing:.06em;color:var(--muted);white-space:nowrap}
.sig{height:28px;display:flex;align-items:center;padding:0 8px;border-radius:5px;font-size:11px;font-weight:700;white-space:nowrap}
.health{height:30px;padding:0 10px;border-radius:6px;border:1px solid #1F6B45;background:#0F2119;display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.flat{flex-shrink:0;height:36px;padding:0 12px;border-radius:6px;border:1px solid #E5484D;background:#2A1114;color:#FFB3B5;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.flat b{font-size:12px;letter-spacing:.04em;white-space:nowrap}.flat span{font-size:9.5px;opacity:.85}
.alert{height:22px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 12px;background:#0E131B;border-bottom:1px solid var(--line)}
.atag{font-size:9.5px;font-weight:700;letter-spacing:.08em;padding:1px 5px;border-radius:3px;color:#C9D1DB;background:#232B38}
.tabrow{height:40px;flex-shrink:0;display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid var(--line);background:#0D1118}
.tab{height:30px;padding:0 16px;border-radius:6px;border:1px solid transparent;display:flex;align-items:center;font-size:12.5px;font-weight:700;letter-spacing:.07em;color:var(--muted);white-space:nowrap}
.tab.on{color:#fff;background:#24324A;border-color:#5AA2FF}
.seg{display:flex;border:1px solid #2E3A4A;border-radius:6px;overflow:hidden}
.seg span{height:26px;display:flex;align-items:center;padding:0 10px;font-size:11.5px;color:var(--soft);white-space:nowrap;border-right:1px solid #2E3A4A;background:#161D28}
.seg span:last-child{border-right:0}
.seg span.on{background:#24324A;color:#fff;box-shadow:inset 0 0 0 1px #5AA2FF}
.seg span.live{color:#FF9EA1}
.btn{height:26px;padding:0 10px;border-radius:5px;border:1px solid #2E3A4A;background:#161D28;color:var(--text);font-size:11.5px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.btn.on{border-color:#5AA2FF;background:#24324A}
.btn.pri{border-color:#5B9BEA;background:#1D5AA8;color:#fff;font-weight:700}
.content{flex-grow:1;min-height:0;padding:8px;display:flex;gap:8px}
.col{display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:6px}
.ptitle{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.ptitle>b{font-size:11px;letter-spacing:.08em;white-space:nowrap}
.ptitle>span{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th,.tr{display:grid;align-items:center;column-gap:8px;padding:0 8px}
.th{height:22px;background:#161D28;border-radius:4px;font-size:9.5px;font-weight:600;letter-spacing:.07em;color:var(--muted)}
.tr{height:30px;border-bottom:1px solid var(--row);font-size:11.5px}
.tr.sel{background:#1B2638;box-shadow:inset 3px 0 0 #5AA2FF}
.tr > *{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r{text-align:right}
.chip{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.04em;white-space:nowrap;border:1px solid}
.you{color:#F2F4F7;border-color:#56627A;background:#1C2330}
.eng{color:var(--teal);border-color:#1E5A55;background:#0E2422}
.wh{color:#8FD9D1;border:1px dashed #3E7F78;background:transparent}
.g{color:var(--green)}.rd{color:var(--red)}.am{color:var(--amber)}.te{color:var(--teal)}.ye{color:var(--yellow)}.mu{color:var(--muted)}.dm{color:var(--dim)}.so{color:var(--soft)}.bl{color:var(--blue)}.pu{color:var(--purple)}
.kv{display:grid;grid-template-columns:118px 1fr;column-gap:10px;row-gap:3px;font-size:11.5px;line-height:1.35}
.kv .k{color:var(--muted);font-size:10.5px;letter-spacing:.04em;padding-top:1px}
.sec{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--muted);border-top:1px solid var(--row);padding-top:6px;margin-top:2px;display:flex;justify-content:space-between}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 11px;min-width:0}
.tile .l{font-size:9.5px;letter-spacing:.07em;color:var(--muted);white-space:nowrap}
.tile .v{font-family:'IBM Plex Mono',monospace;font-size:15px;margin-top:3px;white-space:nowrap}
.tile .s{font-size:10px;color:var(--dim);white-space:nowrap;margin-top:1px}
.subtabs{display:flex;gap:4px}
.st{height:24px;padding:0 10px;border-radius:5px;border:1px solid #2E3A4A;background:#161D28;font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center;white-space:nowrap}
.st.on{color:#fff;border-color:#5AA2FF;background:#24324A}
.src{display:inline-block;width:58px;font-size:9px;font-weight:700;letter-spacing:.06em;text-align:center;border-radius:3px;padding:1px 0}
.note{font-size:10.5px;color:var(--dim);line-height:1.35}
</style>
</head>
<body>
<div class="win" id="win"></div>
<script>
const Q = new URLSearchParams(location.search);
const tab = Q.get('tab') || 'journal';
const live = Q.get('env') === 'live';   // trading mode (top bar); the Review results filter stays PAPER in all drawings
const card = Q.get('card') === '1';
const H = [];
// ---------- thin top bar (same in every window) ----------
H.push(`<header>
<button class="back"><span style="font-size:16px;line-height:1">←</span><b>MAIN WINDOW</b><kbd>F2</kbd></button>
<span class="wtitle">Review</span>
${live?'<span class="env" style="border-color:#E5484D;background:#5A1216;color:#FFB3B5">LIVE — REAL MONEY</span>':'<span class="env">PAPER</span>'}
<span class="autop">AUTO OFF — YOU TRADE</span>
<div style="flex-grow:1"></div>
<span style="display:flex;flex-direction:column;align-items:flex-end;line-height:1.15"><span class="lab">LIVE ALERTS</span><span style="font-size:9.5px;color:#6E7A8A" class="nw">click one to trade</span></span>
<span class="sig" style="border:1px solid #2F9E63;background:rgba(52,199,123,.55);color:#EFFFF6">▲ ABCD strong up</span>
<span class="sig" style="border:1px solid #9D4B7C;background:rgba(244,114,182,.18);color:#FBCFE8">EXIT? GHIJ</span>
<span style="display:flex;flex-direction:column;line-height:1.15;margin-left:4px"><span class="lab">DAY P&amp;L</span><span class="mono g nw" style="font-size:12.5px">+$233.00 · +4.66%</span></span>
<span class="health"><span style="width:8px;height:8px;border-radius:4px;background:#34C77B"></span>HEALTHY</span>
<button class="flat"><b>FLATTEN ALL</b><span>hold 1 s</span></button>
</header>
<div class="alert"><span class="atag">INFO</span><span class="mono mu" style="font-size:10.5px">07:42:16</span><span class="ell so" style="font-size:11px">Engine would have bought ABCD · 500 sh @ $2.12 · AUTO is off, not traded · added to Review as a would-have trade</span><div style="flex-grow:1"></div><span class="bl nw" style="font-size:10.5px">Today's alerts (14) ▸</span></div>`);

// ---------- tab row ----------
const tabs = [['journal','JOURNAL'],['replay','REPLAY'],['performance','PERFORMANCE']].map(([k,l])=>`<span class="tab ${k===tab?'on':''}">${l}</span>`).join('');
let right;
if (tab==='performance') {
  right = `<span class="lab">PERIOD</span><span class="seg"><span>Today</span><span>This week</span><span class="on">Last 30 days</span><span>All</span><span>Custom…</span></span>
  <span class="lab" style="margin-left:10px">OWNER</span><span class="seg"><span class="on">All</span><span>You</span><span>Engine</span></span>`;
} else {
  right = `<span class="btn">◂</span><span class="mono nw" style="font-size:12px;font-weight:600">FRI SEP 25, 2026</span><span class="btn">▸</span><span class="btn">Today</span>`;
}
H.push(`<div class="tabrow">${tabs}<div style="flex-grow:1"></div>${right}
<span class="lab" style="margin-left:14px">SHOWING RESULTS</span><span class="seg"><span class="on">PAPER</span><span class="live">LIVE</span><span style="color:#B08CFF">RESEARCH</span></span>
${live?'<span class="nw" style="margin-left:6px;font-size:10.5px;font-weight:600;color:#F2A93B;border:1px solid #6B4A16;background:#261D0E;border-radius:4px;padding:2px 6px">viewing PAPER results · you are trading LIVE</span>':'<span class="note nw" style="margin-left:6px">filter only · never added together</span>'}</div>`);

const chip = (cls, t) => `<span class="chip ${cls}">${t}</span>`;
const own = o => o==='YOU'?chip('you','YOU'):o==='ENGINE'?chip('eng','ENGINE'):chip('wh','WOULD-HAVE');

// ================= JOURNAL =================
if (tab==='journal') {
  const cols = '62px 50px 40px 94px 1fr 38px 50px 50px 60px 46px 102px 118px';
  const T = [
   ['07:42:16','ABCD','LONG','WH','Explosive runner','500','$2.12','–','+$31','+1.2R','—','open · est. fills'],
   ['07:39:51','IJKL','LONG','YOU','Pullback / continuation','172','$7.60','–','+$42','—','—','open'],
   ['07:25:03','MNOP','LONG','YOU','Bottom reversal','400','$3.12','$3.19','+$28','—','YOU','win'],
   ['07:21:40','GHIJ','LONG','YOU','Moderate move','100','$12.40','–','+$159','—','—','open'],
   ['07:16:12','WXYZ','LONG','ENGINE','Re-entry / 2nd surge','700','$1.79','–','+$64','+2.6R','—','open'],
   ['07:12:39','BCDE','LONG','ENGINE','Explosive runner','600','$0.84','$0.81','−$18','−0.7R','ENGINE','valid strategy loss'],
   ['06:55:40','EFGH','LONG','ENGINE','Pullback / continuation','400','$2.54','$2.58','+$16','+0.6R','ENGINE','win'],
   ['06:48:03','STUV','LONG','ENGINE','Moderate move','400','$0.88','$0.83','−$20','−0.8R','ENGINE','execution / slippage'],
   ['06:31:17','NOPQ','LONG','ENGINE','Bottom reversal','300','$2.10','$2.19','+$27','+1.1R','OVERRIDE EXIT','win'],
   ['06:02:55','HIJK','LONG','ENGINE','Explosive runner','500','$0.57','$0.48','−$45','−1.8R','ENGINE','market regime'],
   ['05:48:20','KLMN','LONG','YOU','Moderate move','300','$1.46','$1.41','−$15','−0.6R','YOUR STOP','valid strategy loss'],
  ];
  const resCls = r => r==='win'?'g':r.startsWith('open')?'mu':r==='valid strategy loss'?'so':(r==='execution / slippage'||r==='market regime')?'am':'rd';
  const byCls = b => b==='YOU'?'':b==='ENGINE'?'te':b==='YOUR STOP'?'ye':b==='OVERRIDE EXIT'?'':b.includes('FLATTEN')||b.includes('ALPACA')?'rd':'dm';
  const rows = T.map(t=>{
    const wh = t[3]==='WH';
    const pnlCls = t[8].startsWith('+')?'g':t[8].startsWith('−')?'rd':'mu';
    return `<div class="tr ${t[1]==='MNOP'?'sel':''}" style="column-gap:6px;grid-template-columns:${cols};${wh?'color:#AAB6C4;font-style:italic':''}">
    <span class="mono">${t[0]}</span><span style="font-weight:700;font-style:normal">${t[1]}</span><span class="g" style="font-size:10.5px">${t[2]}</span>
    <span style="font-style:normal">${wh?chip('wh','WOULD-HAVE'):own(t[3])}</span><span class="so">${t[4]}</span>
    <span class="mono r">${t[5]}</span><span class="mono r">${t[6]}</span><span class="mono r">${t[7]}</span>
    <span class="mono r ${pnlCls}" style="${wh?'opacity:.75':''}">${t[8]}</span><span class="mono r ${t[9].startsWith('+')?'g':t[9].startsWith('−')?'rd':'dm'}" style="${wh?'opacity:.75':''}">${t[9]}</span>
    <span class="${byCls(t[10])}" style="font-size:10.5px;font-weight:${t[10]==='OVERRIDE EXIT'?700:500};font-style:normal">${t[10]}</span><span class="${resCls(t[11])}" style="font-size:11px">${t[11]}</span></div>`;}).join('');
  const resTile = (l,v,c)=>`<div style="flex:1;min-width:0;background:#0F141C;border:1px solid var(--line);border-radius:6px;padding:4px 8px"><div class="lab" style="font-size:9px">${l}</div><div class="mono ${c}" style="font-size:12.5px">${v}</div></div>`;
  const trades = `<section class="panel" style="flex:0 0 486px">
   <div class="ptitle"><b>TRADES · FRI SEP 25</b><span>one row per round trip · 10 real trades (7 closed, 3 open) + 1 would-have · realized −$27 · open +$265 · fees −$5 · day +$233.00</span></div>
   <div style="display:flex;gap:5px;align-items:center"><span class="btn on">All</span><span class="btn">Yours</span><span class="btn">Engine's</span><span class="btn">Would-have</span><span class="btn">Losses</span><span class="btn">Overrides &amp; flattens</span>
    <span class="btn" style="width:120px;color:var(--dim)">⌕ ticker</span><div style="flex-grow:1"></div><span class="btn">⇩ EXPORT CSV</span></div>
   <div class="th" style="column-gap:6px;grid-template-columns:${cols}"><span>TIME</span><span>SYMBOL</span><span>SIDE</span><span>OWNER</span><span>SETUP</span><span class="r">SH</span><span class="r">ENTRY</span><span class="r">EXIT</span><span class="r">P&amp;L</span><span class="r">R</span><span>CLOSED BY</span><span>RESULT</span></div>
   <div>${rows}</div>
   <div style="display:flex;gap:6px;margin-top:2px">${resTile('WINS','+$71','g')}${resTile('VALID STRATEGY LOSS','−$33','so')}${resTile('EXECUTION / SLIPPAGE','−$20','am')}${resTile('MARKET REGIME','−$45','am')}${resTile('TECHNICAL FAILURE','$0','mu')}${resTile('RULE BREAKS','0','mu')}</div>
  </section>`;
  const missCols='48px 44px 104px 1fr';
  const miss = [['EFHI','+48%','#14 at 06:40','needed Level 2; all 3 slots were busy'],['YZAB','+31%','#38 at 07:05','spread too wide when the trigger fired'],['CDFG','+22%','outside the 50','volume came late; promoted after the move'],['QRST','+19%','#9 at 07:30','AUTO off · no click from you (human timing)']];
  const missed = `<section class="panel" style="flex:1">
   <div class="ptitle"><b>MISSED RUNNERS · RULE v1</b><span>catchable then, not traded · +2 not catchable</span></div>
   <div class="th" style="grid-template-columns:${missCols}"><span>SYMBOL</span><span class="r">MOVE</span><span>FIRST SEEN</span><span>WHY IT WAS MISSED</span></div>
   ${miss.map(m=>`<div class="tr" style="height:auto;min-height:27px;padding-top:4px;padding-bottom:4px;grid-template-columns:${missCols}"><span style="font-weight:700">${m[0]}</span><span class="mono r g">${m[1]}</span><span class="so" style="font-size:11px">${m[2]}</span><span class="so" style="font-size:11px;white-space:normal;line-height:1.3">${m[3]}</span></div>`).join('')}
  </section>`;
  const evCols='62px 1fr';
  const ev = [
   ['07:20:02','<b>STOP AUTO</b> (you) → AUTO OFF · 1 engine entry cancelled · WXYZ still engine-managed',''],
   ['06:47:15','<span class="am">ALPACA CONNECTIVITY ISSUE · CAUSE UNKNOWN</span> · 0:38 · new AUTO entries blocked',''],
   ['06:44:10','<b>OVERRIDE EXIT NOPQ</b> (you) · closed at $2.19 · re-entry paused for that setup',''],
   ['06:12:31','HIJK <span class="mu">HALTED</span> · 2:40 elapsed · resumed 06:15:11',''],
   ['06:00:05','<b>AUTO ON — ENGINE CAN TRADE</b> (you, hold 2 s)',''],
   ['05:55:31','<span class="ye">YOUR STOP</span> hit on KLMN · sold 300 @ $1.41',''],
  ];
  const events = `<section class="panel" style="flex:1.18">
   <div class="ptitle"><div class="subtabs"><span class="st on">DAY EVENTS (9)</span><span class="st">BLOCKED &amp; REJECTED (4)</span></div><span>alert history, kept for good</span></div>
   ${ev.map(e=>`<div class="tr" style="height:auto;min-height:27px;padding-top:4px;padding-bottom:4px;grid-template-columns:${evCols}"><span class="mono mu" style="font-size:10.5px">${e[0]}</span><span class="so" style="font-size:11px;white-space:normal;line-height:1.3">${e[1]}</span></div>`).join('')}
  </section>`;
  const why = `<section class="panel" style="flex-grow:1;gap:5px">
   <div class="ptitle"><b>WHY · MNOP · 07:25:03</b><span>selected trade</span></div>
   <div style="display:flex;gap:5px;align-items:center;flex-wrap:wrap">${chip('you','YOURS')}<span class="chip" style="color:#8CE0B0;border-color:#1F6B45;background:#0F2119">LONG</span><span class="chip" style="color:var(--soft);border-color:#3A4556">BOTTOM REVERSAL</span><span class="chip" style="color:var(--green);border-color:#1F6B45">WIN</span><div style="flex-grow:1"></div><span class="mono g" style="font-size:14px">+$28.00 · +2.2%</span><span class="mono dm" style="font-size:11px">R —</span></div>
   <div class="sec"><span>YOUR ENTRY</span></div>
   <div class="kv"><span class="k">CLICK</span><span>07:25:03.412 · BUY on the <b>Selected card</b></span>
   <span class="k">SIZE</span><span>25% preset = $1,308 ÷ ceiling $3.27 = <b>400 sh</b></span>
   <span class="k">FILL</span><span>400 @ <b>$3.12</b> · 2 steps · 380 ms · ask at click $3.11 → <span class="am">+$0.01 slippage (0.3%)</span></span></div>
   <div class="sec"><span>ORDER TRAIL</span><span class="dm" style="letter-spacing:0;font-weight:400">ALPACA</span></div>
   <div class="mono" style="font-size:10.5px;line-height:1.45;color:var(--soft)">.412 click → .431 BUY 400 limit $3.11 sent → .502 ack → .610 raised to $3.12 → .792 filled 400 @ $3.12</div>
   <div class="sec"><span>WHAT THE ENGINE SAW AT YOUR CLICK</span></div>
   <div class="kv"><span class="k">RANK · L2</span><span>#6 · no Level 2 slot (quotes and trades only)</span>
   <span class="k">ENGINE</span><span>rebound forming · not triggered yet</span>
   <span class="k">AI</span><span><span class="am">CAUTION</span> · 2m old · “dilution filing last week”</span>
   <span class="k">NEWS</span><span>C · 3h · follow-up press release</span></div>
   <div class="sec"><span>YOU VS ENGINE ON THIS TRADE</span><span class="dm" style="letter-spacing:0;font-weight:400">engine = would-have, est. fills</span></div>
   <div style="display:grid;grid-template-columns:70px 1fr 1fr 70px;column-gap:8px;row-gap:2px;font-size:11.5px;align-items:center">
    <span></span><span class="lab">IN</span><span class="lab">OUT</span><span class="lab" style="text-align:right">RESULT</span>
    <span>${chip('you','YOU')}</span><span class="mono">07:25:03 · $3.12</span><span class="mono">07:33:12 · $3.19</span><span class="mono g r">+$28</span>
    <span>${chip('wh','ENGINE')}</span><span class="mono" style="color:#AAB6C4">07:25:09 · $3.14</span><span class="mono" style="color:#AAB6C4">07:31:40 · $3.17</span><span class="mono g r" style="opacity:.75">+$12</span>
   </div>
   <div class="note">You were in 6 s earlier and $0.02 cheaper, and held longer: <span class="g">+$16 better than the engine</span> on this one.</div>
